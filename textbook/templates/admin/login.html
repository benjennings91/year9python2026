{% extends "base.html" %}

{% block title %}Admin login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-3">Admin login</h1>
        {% if not_configured %}
        <div class="alert alert-warning">
            No admin password has been set. On the server, run
            <code>flask --app app set-password</code>, then restart the app.
        </div>
        {% else %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" autofocus required>
            </div>
            <button class="btn btn-primary">Log in</button>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}
