<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Interactive Python{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand navbar-light bg-light mb-4">
        <div class="container{% block container_size %}{% endblock %}">
            <a class="navbar-brand" href="{{ url_for('reader.index') }}">Interactive Python</a>
            {% if is_admin %}
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" href="{{ url_for('admin.chapters') }}">Admin</a>
                <form method="post" action="{{ url_for('admin.logout') }}" class="ms-2">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="btn btn-outline-secondary btn-sm">Log out</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container{{ self.container_size() }}">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
